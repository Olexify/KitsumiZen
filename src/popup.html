<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>KitsumiZen</h1>
  <label class="row"><span>Hide player UI</span><input type="checkbox" id="enabled"></label>
  <hr>
  <label class="row"><span>Pointer</span>
    <select id="cursor">
      <option value="hidden">Hidden</option>
      <option value="system">System</option>
      <option value="dot">Dot</option>
      <option value="ring">Ring (smooth)</option>
      <option value="crosshair">Crosshair</option>
      <option value="glow">Glow (smooth)</option>
      <option value="arrow">Arrow</option>
      <option value="trail">Comet trail</option>
    </select>
  </label>
  <label class="row"><span>Color</span><input type="color" id="cursorColor"></label>
  <label class="row"><span>Size</span><input type="range" id="cursorSize" min="12" max="56" step="2"></label>
  <label class="row"><span>Click ripple</span><input type="checkbox" id="ripple"></label>
  <hr>
  <label class="row"><span>Hide seek / volume popups</span><input type="checkbox" id="hideSeek"></label>
  <label class="row"><span>Hide hold-to-speed 2x</span><input type="checkbox" id="hideSpeed"></label>
  <p class="hint">Shortcut on YouTube: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd></p>
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body></html>
